<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>باشگاه اکو</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161A20">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#161A20; --bg2:#1E232B; --card:#242A33;
  --ink:#F2EFE9; --sub:#9BA3AF;
  --gold:#D4A857; --green:#5AA97C; --red:#C1553B;
  --line:#323944;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F5F3EE; --bg2:#FFFFFF; --card:#FFFFFF;
    --ink:#1C1F26; --sub:#6B7280; --line:#E5E1D8;
  }
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:'Vazirmatn','Noto Sans Arabic','Noto Naskh Arabic',Tahoma,Roboto,sans-serif; -webkit-font-smoothing:antialiased;
}
header{
  position:sticky; top:0; z-index:5;
  padding:calc(18px + env(safe-area-inset-top,0px)) 18px 14px;
  background:var(--bg); border-bottom:1px solid var(--line);
}
h1{margin:0 0 2px; font-size:22px; font-weight:800; letter-spacing:-.3px;}
.sub{color:var(--sub); font-size:13px; margin:0;}
.stats{display:flex; gap:10px; margin-top:14px;}
.stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px;}
.stat b{display:block; font-size:20px; font-weight:800;}
.stat.paid b{color:var(--green);} .stat.unpaid b{color:var(--red);}
.stat span{font-size:12px; color:var(--sub);}
.controls{padding:14px 18px 4px; display:flex; gap:8px;}
input[type=text],input[type=tel],select{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg2); color:var(--ink); font-family:inherit; font-size:14px;
}
select{appearance:none; -webkit-appearance:none;}
input:focus{outline:2px solid var(--gold); outline-offset:1px;}
.filters{display:flex; gap:6px; padding:10px 18px 4px;}
.chip{
  padding:6px 14px; border-radius:999px; border:1px solid var(--line);
  background:var(--bg2); color:var(--sub); font-size:12.5px; cursor:pointer; font-family:inherit;
}
.chip.active{background:var(--gold); color:#1C1608; border-color:var(--gold); font-weight:600;}
.months{
  display:flex; gap:6px; padding:14px 18px 4px; overflow-x:auto;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.months::-webkit-scrollbar{display:none;}
.month-chip{
  flex:none; padding:8px 16px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg2); color:var(--sub); font-size:13px; cursor:pointer; font-family:inherit;
}
.month-chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700;}
main{padding:12px 18px 100px;}
.member{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
}
.avatar{
  width:42px; height:42px; border-radius:11px; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:16px; color:#1C1608; background:var(--gold);
}
.info{flex:1; min-width:0;}
.name{font-weight:700; font-size:15px; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.phone{color:var(--sub); font-size:12.5px; margin:0;}
.status-btn{
  border:none; border-radius:11px; padding:9px 14px; font-family:inherit;
  font-size:12.5px; font-weight:700; cursor:pointer; flex:none;
}
.status-btn.paid{background:rgba(90,169,124,.18); color:var(--green);}
.status-btn.unpaid{background:rgba(193,85,59,.18); color:var(--red);}
.del{background:none; border:none; color:var(--sub); font-size:18px; cursor:pointer; padding:4px 6px; flex:none;}
.tag{
  display:inline-block; font-size:11px; padding:2px 9px; border-radius:999px;
  background:var(--bg); color:var(--sub); border:1px solid var(--line); margin-top:4px;
}
.empty{text-align:center; color:var(--sub); padding:60px 20px; font-size:14px; line-height:2;}
.fab{
  position:fixed; left:18px; bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:56px; height:56px; border-radius:16px; border:none; background:var(--gold);
  color:#1C1608; font-size:26px; font-weight:700; cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center;
}
.sheet-bg{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
  align-items:flex-end; justify-content:center; z-index:20;
}
.sheet-bg.show{display:flex;}
.sheet{
  background:var(--bg2); width:100%; max-width:480px; border-radius:20px 20px 0 0;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
}
.sheet h2{margin:0 0 14px; font-size:17px;}
.sheet label{font-size:12.5px; color:var(--sub); display:block; margin:12px 0 6px;}
.sheet-actions{display:flex; gap:10px; margin-top:20px;}
.btn{flex:1; padding:12px; border-radius:12px; border:none; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;}
.btn.primary{background:var(--gold); color:#1C1608;}
.btn.ghost{background:var(--bg); color:var(--ink); border:1px solid var(--line);}
</style>
</head>
<body>

<header>
  <h1>باشگاه اکو</h1>
  <p class="sub" id="monthLabel"></p>
  <div class="stats">
    <div class="stat paid"><b id="paidCount">0</b><span>پرداخت‌شده</span></div>
    <div class="stat unpaid"><b id="unpaidCount">0</b><span>معوق</span></div>
    <div class="stat"><b id="totalCount">0</b><span>کل اعضا</span></div>
  </div>
</header>

<div class="months" id="months"></div>

<div class="controls">
  <input type="text" id="search" placeholder="جستجوی نام یا شماره...">
</div>
<div class="filters" id="statusFilters">
  <button class="chip active" data-f="all">همه</button>
  <button class="chip" data-f="unpaid">معوق</button>
  <button class="chip" data-f="paid">پرداخت‌شده</button>
</div>
<div class="filters" id="sportFilters">
  <button class="chip active" data-s="all">همه رشته‌ها</button>
  <button class="chip" data-s="بدنسازی">بدنسازی</button>
  <button class="chip" data-s="ژیمناستیک">ژیمناستیک</button>
  <button class="chip" data-s="تکواندو">تکواندو</button>
  <button class="chip" data-s="بوکس">بوکس</button>
</div>

<main id="list"></main>

<button class="fab" id="addBtn" aria-label="افزودن عضو">+</button>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h2>عضو جدید</h2>
    <label>نام و نام خانوادگی</label>
    <input type="text" id="newName" placeholder="مثلاً علی محمدی">
    <label>شماره تماس (اختیاری)</label>
    <input type="tel" id="newPhone" placeholder="0912...">
    <label>رشته</label>
    <select id="newSport">
      <option value="بدنسازی">بدنسازی</option>
      <option value="ژیمناستیک">ژیمناستیک</option>
      <option value="تکواندو">تکواندو</option>
      <option value="بوکس">بوکس</option>
    </select>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelBtn">انصراف</button>
      <button class="btn primary" id="saveBtn">افزودن</button>
    </div>
  </div>
</div>

<script>
const year = new Date().getFullYear();
const currentMonthIndex = new Date().getMonth(); // 0-11
let selectedMonth = currentMonthIndex;
const monthNames = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

function monthKeyFor(i){ return year+'-'+(i+1); }

function renderMonths(){
  const wrap = document.getElementById('months');
  wrap.innerHTML = monthNames.map((name,i)=>
    `<button class="month-chip ${i===selectedMonth?'active':''}" data-m="${i}">${name}</button>`
  ).join('');
  document.getElementById('monthLabel').textContent =
    'وضعیت شهریه — ' + monthNames[selectedMonth] + (selectedMonth===currentMonthIndex ? ' (این ماه)' : '');
}
document.getElementById('months').addEventListener('click', e=>{
  const btn = e.target.closest('[data-m]');
  if(!btn) return;
  selectedMonth = Number(btn.dataset.m);
  renderMonths();
  render();
});

let members = [];
try {
  const raw = localStorage.getItem('gym_members_v1');
  members = raw ? JSON.parse(raw) : [];
} catch(e) { members = []; }

function save(){
  try { localStorage.setItem('gym_members_v1', JSON.stringify(members)); } catch(e) {}
}

function isPaid(m){ return !!m.paidMonths[monthKeyFor(selectedMonth)]; }

let filter = 'all';
let sportFilter = 'all';
let query = '';

function render(){
  const list = document.getElementById('list');
  const q = query.trim().toLowerCase();
  let filtered = members.filter(m=>{
    if(q && !(m.name.toLowerCase().includes(q) || (m.phone||'').includes(q))) return false;
    if(filter==='paid' && !isPaid(m)) return false;
    if(filter==='unpaid' && isPaid(m)) return false;
    if(sportFilter!=='all' && m.sport!==sportFilter) return false;
    return true;
  });

  document.getElementById('totalCount').textContent = members.length;
  document.getElementById('paidCount').textContent = members.filter(isPaid).length;
  document.getElementById('unpaidCount').textContent = members.filter(m=>!isPaid(m)).length;

  if(filtered.length===0){
    list.innerHTML = `<div class="empty">${members.length===0 ? 'هنوز عضوی اضافه نشده.<br>با دکمهٔ + یک عضو جدید اضافه کن.' : 'موردی پیدا نشد.'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(m=>{
    const paid = isPaid(m);
    const initial = m.name.trim().charAt(0) || '؟';
    return `
    <div class="member">
      <div class="avatar">${initial}</div>
      <div class="info">
        <p class="name">${escapeHtml(m.name)}</p>
        <p class="phone">${m.phone ? escapeHtml(m.phone) : 'بدون شماره'}</p>
        ${m.sport ? `<span class="tag">${escapeHtml(m.sport)}</span>` : ''}
      </div>
      <button class="status-btn ${paid?'paid':'unpaid'}" data-id="${m.id}">${paid?'پرداخت‌شده':'ثبت پرداخت'}</button>
      <button class="del" data-del="${m.id}" aria-label="حذف">×</button>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('list').addEventListener('click', e=>{
  const btn = e.target.closest('[data-id]');
  const del = e.target.closest('[data-del]');
  if(btn){
    const m = members.find(x=>x.id===btn.dataset.id);
    if(m){ const k = monthKeyFor(selectedMonth); m.paidMonths[k] = !m.paidMonths[k]; save(); render(); }
  }
  if(del){
    members = members.filter(x=>x.id!==del.dataset.del);
    save(); render();
  }
});

document.getElementById('search').addEventListener('input', e=>{
  query = e.target.value; render();
});

document.querySelectorAll('#statusFilters .chip').forEach(c=>{
  c.addEventListener('click', ()=>{
    document.querySelectorAll('#statusFilters .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    filter = c.dataset.f;
    render();
  });
});

document.querySelectorAll('#sportFilters .chip').forEach(c=>{
  c.addEventListener('click', ()=>{
    document.querySelectorAll('#sportFilters .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    sportFilter = c.dataset.s;
    render();
  });
});

const sheetBg = document.getElementById('sheetBg');
document.getElementById('addBtn').addEventListener('click', ()=>{
  sheetBg.classList.add('show');
  document.getElementById('newName').focus();
});
document.getElementById('cancelBtn').addEventListener('click', ()=> closeSheet());
sheetBg.addEventListener('click', e=>{ if(e.target===sheetBg) closeSheet(); });
function closeSheet(){
  sheetBg.classList.remove('show');
  document.getElementById('newName').value='';
  document.getElementById('newPhone').value='';
}
document.getElementById('saveBtn').addEventListener('click', ()=>{
  const name = document.getElementById('newName').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  const sport = document.getElementById('newSport').value;
  if(!name) return;
  members.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), name, phone, sport, paidMonths:{} });
  save();
  closeSheet();
  render();
});

renderMonths();
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
