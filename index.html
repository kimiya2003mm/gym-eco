<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>باشگاه اکو</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161A20">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161A20; --bg2:#1E232B; --card:#242A33;
  --ink:#F2EFE9; --sub:#9BA3AF;
  --gold:#D4A857; --green:#5AA97C; --red:#C1553B;
  --line:#323944;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F5F3EE; --bg2:#FFFFFF; --card:#FFFFFF;
    --ink:#1C1F26; --sub:#6B7280; --line:#E5E1D8;
  }
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:'Vazirmatn',sans-serif; -webkit-font-smoothing:antialiased;
}
header{
  position:sticky; top:0; z-index:5;
  padding:calc(18px + env(safe-area-inset-top,0px)) 18px 14px;
  background:var(--bg); border-bottom:1px solid var(--line);
}
h1{margin:0 0 2px; font-size:22px; font-weight:800; letter-spacing:-.3px;}
.sub{color:var(--sub); font-size:13px; margin:0;}
.stats{display:flex; gap:10px; margin-top:14px;}
.stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px;}
.stat b{display:block; font-size:20px; font-weight:800;}
.stat.paid b{color:var(--green);} .stat.unpaid b{color:var(--red);}
.stat span{font-size:12px; color:var(--sub);}
.controls{padding:14px 18px 4px; display:flex; gap:8px;}
input[type=text],input[type=tel],select{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg2); color:var(--ink); font-family:inherit; font-size:14px;
}
select{appearance:none; -webkit-appearance:none;}
input:focus{outline:2px solid var(--gold); outline-offset:1px;}
.filters{display:flex; gap:6px; padding:10px 18px 4px;}
.chip{
  padding:6px 14px; border-radius:999px; border:1px solid var(--line);
  background:var(--bg2); color:var(--sub); font-size:12.5px; cursor:pointer; font-family:inherit;
}
.chip.active{background:var(--gold); color:#1C1608; border-color:var(--gold); font-weight:600;}
.months{
  display:flex; gap:6px; padding:14px 18px 4px; overflow-x:auto;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.months::-webkit-scrollbar{display:none;}
.month-chip{
  flex:none; padding:8px 16px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg2); color:var(--sub); font-size:13px; cursor:pointer; font-family:inherit;
}
.month-chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700;}
main{padding:12px 18px 100px;}
.member{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
}
.avatar{
  width:42px; height:42px; border-radius:11px; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:16px; color:#1C1608; background:var(--gold);
}
.info{flex:1; min-width:0;}
.name{font-weight:700; font-size:15px; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.phone{color:var(--sub); font-size:12.5px; margin:0;}
.status-btn{
  border:none; border-radius:11px; padding:9px 14px; font-family:inherit;
  font-size:12.5px; font-weight:700; cursor:pointer; flex:none;
}
.status-btn.paid{background:rgba(90,169,124,.18); color:var(--green);}
.status-btn.unpaid{background:rgba(193,85,59,.18); color:var(--red);}
.del{background:none; border:none; color:var(--sub); font-size:18px; cursor:pointer; padding:4px 6px; flex:none;}
.tag{
  display:inline-block; font-size:11px; padding:2px 9px; border-radius:999px;
  background:var(--bg); color:var(--sub); border:1px solid var(--line); margin-top:4px;
}
.empty{text-align:center; color:var(--sub); padding:60px 20px; font-size:14px; line-height:2;}
.fab{
  position:fixed; left:18px; bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:56px; height:56px; border-radius:16px; border:none; background:var(--gold);
  color:#1C1608; font-size:26px; font-weight:700; cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center;
}
.sheet-bg{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
  align-items:flex-end; justify-content:center; z-index:20;
}
.sheet-bg.show{display:flex;}
.sheet{
  background:var(--bg2); width:100%; max-width:480px; border-radius:20px 20px 0 0;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
}
.sheet h2{margin:0 0 14px; font-size:17px;}
.sheet label{font-size:12.5px; color:var(--sub); display:block; margin:12px 0 6px;}
.sheet-actions{display:flex; gap:10px; margin-top:20px;}
.btn{flex:1; padding:12px; border-radius:12px; border:none; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;}
.btn.primary{background:var(--gold); color:#1C1608;}
.btn.ghost{background:var(--bg); color:var(--ink); border:1px solid var(--line);}
.alert-banner{margin:12px 18px 0;padding:11px 14px;border-radius:12px;background:rgba(193,85,59,.16);border:1px solid var(--red);color:var(--red);font-size:13px;font-weight:600;cursor:pointer;display:none;}
.alert-banner.show{display:block;}
.member.overdue{border-color:var(--red);}
.due{font-size:11.5px;margin:4px 0 0;color:var(--sub);}
.due.late{color:var(--red);font-weight:600;}
.month-chip{position:relative;}
.month-chip .dot{position:absolute;top:4px;left:5px;width:7px;height:7px;border-radius:50%;background:var(--red);}
.date-row{display:flex;gap:8px;}
.backup-btn{position:absolute;left:18px;top:calc(18px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.backup-note{font-size:12.5px;color:var(--sub);line-height:1.9;margin:0 0 6px;}
.btn.full{width:100%;flex:none;margin-top:10px;}
</style>
</head>
<body>

<header>
  <button class="backup-btn" id="backupOpen" aria-label="پشتیبان‌گیری">💾</button>
  <h1>باشگاه اکو</h1>
  <p class="sub" id="monthLabel"></p>
  <div class="stats">
    <div class="stat paid"><b id="paidCount">0</b><span>پرداخت‌شده</span></div>
    <div class="stat unpaid"><b id="unpaidCount">0</b><span>معوق</span></div>
    <div class="stat"><b id="totalCount">0</b><span>کل اعضا</span></div>
  </div>
</header>
<div class="alert-banner" id="alertBanner"></div>

<div class="months" id="months"></div>

<div class="controls">
  <input type="text" id="search" placeholder="جستجوی نام یا شماره...">
</div>
<div class="filters" id="statusFilters">
  <button class="chip active" data-f="all">همه</button>
  <button class="chip" data-f="unpaid">معوق</button>
  <button class="chip" data-f="paid">پرداخت‌شده</button>
</div>
<div class="filters" id="sportFilters">
  <button class="chip active" data-s="all">همه رشته‌ها</button>
  <button class="chip" data-s="بدنسازی">بدنسازی</button>
  <button class="chip" data-s="ژیمناستیک">ژیمناستیک</button>
  <button class="chip" data-s="تکواندو">تکواندو</button>
  <button class="chip" data-s="بوکس">بوکس</button>
</div>

<main id="list"></main>

<button class="fab" id="addBtn" aria-label="افزودن عضو">+</button>

<div class="sheet-bg" id="endBg">
  <div class="sheet">
    <h2 id="endTitle"></h2>
    <div id="endList" style="max-height:40vh;overflow:auto;line-height:2.1;font-size:14px;"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="endOk">باشه</button>
      <button class="btn primary" id="endView">مشاهده لیست</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h2 id="sheetTitle">عضو جدید</h2>
    <label>نام و نام خانوادگی</label>
    <input type="text" id="newName" placeholder="مثلاً علی محمدی">
    <label>شماره تماس (اختیاری)</label>
    <input type="tel" id="newPhone" placeholder="0912...">
    <label>رشته</label>
    <select id="newSport">
      <option value="بدنسازی">بدنسازی</option>
      <option value="ژیمناستیک">ژیمناستیک</option>
      <option value="تکواندو">تکواندو</option>
      <option value="بوکس">بوکس</option>
    </select>
    <label>تاریخ ثبت‌نام</label>
    <div class="date-row">
      <select id="regD"></select><select id="regM"></select><select id="regY"></select>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelBtn">انصراف</button>
      <button class="btn primary" id="saveBtn">افزودن</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="backupBg">
  <div class="sheet">
    <h2>پشتیبان‌گیری از اطلاعات</h2>
    <p class="backup-note">اطلاعات فقط روی همین گوشی ذخیره می‌شود. با دکمهٔ زیر یک فایل پشتیبان بگیر و آن را جای امن نگه دار (مثلاً در «Files» یا برای خودت در تلگرام بفرست).</p>
    <button class="btn primary full" id="exportBtn">⬇ دانلود فایل پشتیبان</button>
    <button class="btn ghost full" id="importBtn">⬆ بازیابی از فایل پشتیبان</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    <div class="sheet-actions"><button class="btn ghost" id="backupClose">بستن</button></div>
  </div>
</div>

<script>
/* ---- تقویم شمسی (تبدیل میلادی ⇄ شمسی) ---- */
const fa = n => String(n).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const div=(a,b)=>~~(a/b), mod=(a,b)=>a-~~(a/b)*b;
const BRK=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){
  let gy=jy+621, leapJ=-14, jp=BRK[0], jm, jump=0, n, i;
  for(i=1;i<BRK.length;i++){
    jm=BRK[i]; jump=jm-jp;
    if(jy<jm) break;
    leapJ+=div(jump,33)*8+div(mod(jump,33),4); jp=jm;
  }
  n=jy-jp;
  leapJ+=div(n,33)*8+div(mod(n,33)+3,4);
  if(mod(jump,33)===4 && jump-n===4) leapJ++;
  const leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
  const march=20+leapJ-leapG;
  if(jump-n<6) n=n-jump+div(jump+4,33)*33;
  let leap=mod(mod(n+1,33)-1,4); if(leap===-1) leap=4;
  return {leap, gy, march};
}
function g2d(gy,gm,gd){
  let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
  return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
}
function d2g(jdn){
  let j=4*jdn+139361631;
  j+=div(div(4*jdn+183187720,146097)*3,4)*4-3908;
  const i=div(mod(j,1461),4)*5+308;
  const gd=div(mod(i,153),5)+1, gm=mod(div(i,153),12)+1;
  return {gy:div(j,1461)-100100+div(8-gm,6), gm, gd};
}
function j2d(jy,jm,jd){ const r=jalCal(jy); return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1; }
function toJalali(gy,gm,gd){
  const jdn=g2d(gy,gm,gd); let jy=d2g(jdn).gy-621; const r=jalCal(jy);
  let k=jdn-g2d(jy+621,3,r.march);
  if(k>=0){
    if(k<=185) return {jy, jm:1+div(k,31), jd:mod(k,31)+1};
    k-=186;
  } else { jy--; k+=179; if(r.leap===1) k++; }
  return {jy, jm:7+div(k,30), jd:mod(k,30)+1};
}
function mLen(jy,jm){ return jm<=6?31 : jm<=11?30 : (jalCal(jy).leap===0?30:29); }

const _n = new Date();
const today = toJalali(_n.getFullYear(), _n.getMonth()+1, _n.getDate());
const year = today.jy;
const currentMonthIndex = today.jm-1; // 0-11
let selectedMonth = currentMonthIndex;
const monthNames = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

function monthKeyFor(i){ return year+'-'+(i+1); }

function renderMonths(){
  const wrap = document.getElementById('months');
  wrap.innerHTML = monthNames.map((name,i)=>
    `<button class="month-chip ${i===selectedMonth?'active':''}" data-m="${i}">${name}${(i<=currentMonthIndex && members.some(m=>hasLate(m,i)))?'<i class="dot"></i>':''}</button>`
  ).join('');
  document.getElementById('monthLabel').textContent =
    'وضعیت شهریه — ' + monthNames[selectedMonth] + (selectedMonth===currentMonthIndex ? ' (این ماه)' : '');
}
document.getElementById('months').addEventListener('click', e=>{
  const btn = e.target.closest('[data-m]');
  if(!btn) return;
  selectedMonth = Number(btn.dataset.m);
  renderMonths();
  render();
});

let members = [];
try {
  const raw = localStorage.getItem('gym_members_v1');
  members = raw ? JSON.parse(raw) : [];
} catch(e) { members = []; }

function save(){
  try { localStorage.setItem('gym_members_v1', JSON.stringify(members)); } catch(e) {}
}
// مهاجرت: کلیدهای قدیمی (سال میلادی) به سال شمسی
members.forEach(m=>{
  m.paidMonths = m.paidMonths || {};
  Object.keys(m.paidMonths).forEach(k=>{
    const [y,mo]=k.split('-');
    if(+y>1500){ m.paidMonths[(+y-621)+'-'+mo]=m.paidMonths[k]; delete m.paidMonths[k]; }
  });
});
save();

function isPaid(m){ return !!m.paidMonths[monthKeyFor(selectedMonth)]; }

// سررسید ماه i: همان روزِ ثبت‌نام، از ماه بعد از ثبت‌نام به بعد
function dueDate(m,i){
  const r=m.regDate; if(!r) return null;
  if(year*12+i <= r.jy*12+r.jm-1) return null;
  return {jm:i+1, jd:Math.min(r.jd, mLen(year,i+1))};
}
function daysLate(m,i){
  const d=dueDate(m,i); if(!d) return null;
  return j2d(today.jy,today.jm,today.jd) - j2d(year,d.jm,d.jd);
}
function isOverdue(m,i){
  if(m.paidMonths[monthKeyFor(i)]) return false;
  if(!m.regDate) return true; // اعضای قدیمی بدون تاریخ: مثل قبل
  const ci=year*12+i, ri=m.regDate.jy*12+m.regDate.jm-1;
  if(ci<ri) return false;                        // قبل از ثبت‌نام
  if(ci<year*12+currentMonthIndex) return true;  // ماه تمام شده و پرداخت ثبت نشده
  const d=daysLate(m,i); return d!==null && d>=0; // ماه جاری: از روزِ سررسید
}
// برای هشدار: اعضای بدون تاریخ فقط برای ماهِ قبل حساب می‌شوند
const hasLate = (m,i)=> m.regDate ? isOverdue(m,i) : (i===currentMonthIndex-1 && !m.paidMonths[monthKeyFor(i)]);
function setFilter(f){
  filter=f;
  document.querySelectorAll('#statusFilters .chip').forEach(x=>x.classList.toggle('active',x.dataset.f===f));
  render();
}

let filter = 'all';
let sportFilter = 'all';
let query = '';

function render(){
  renderMonths();
  const b=document.getElementById('alertBanner');
  const late=members.filter(m=>monthNames.some((_,i)=>i<=currentMonthIndex && hasLate(m,i)));
  if(late.length){ b.textContent='⚠ '+fa(late.length)+' نفر شهریهٔ سررسیدشده را پرداخت نکرده‌اند — برای مشاهده لمس کنید'; b.classList.add('show'); }
  else b.classList.remove('show');
  const list = document.getElementById('list');
  const q = query.trim().toLowerCase();
  let filtered = members.filter(m=>{
    if(q && !(m.name.toLowerCase().includes(q) || (m.phone||'').includes(q))) return false;
    if(filter==='paid' && !isPaid(m)) return false;
    if(filter==='unpaid' && !isOverdue(m,selectedMonth)) return false;
    if(sportFilter!=='all' && m.sport!==sportFilter) return false;
    return true;
  });

  document.getElementById('totalCount').textContent = members.length;
  document.getElementById('paidCount').textContent = members.filter(isPaid).length;
  document.getElementById('unpaidCount').textContent = members.filter(m=>isOverdue(m,selectedMonth)).length;

  if(filtered.length===0){
    list.innerHTML = `<div class="empty">${members.length===0 ? 'هنوز عضوی اضافه نشده.<br>با دکمهٔ + یک عضو جدید اضافه کن.' : 'موردی پیدا نشد.'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(m=>{
    const paid = isPaid(m);
    const initial = m.name.trim().charAt(0) || '؟';
    const d = dueDate(m,selectedMonth), over = hasLate(m,selectedMonth), n = over ? daysLate(m,selectedMonth) : 0;
    const dueHtml = over && !d ? '<p class="due late">⚠ ماه تمام شد و پرداخت ثبت نشده</p>'
      : !m.regDate ? '<p class="due">تاریخ ثبت‌نام ثبت نشده — برای تنظیم لمس کنید</p>'
      : d ? `<p class="due ${over?'late':''}">${over?'⚠ ':''}سررسید: ${fa(d.jd)} ${monthNames[d.jm-1]}${over?(n>0?' — '+fa(n)+' روز تأخیر':' — امروز'):''}</p>`
      : `<p class="due">ثبت‌نام: ${fa(m.regDate.jd)} ${monthNames[m.regDate.jm-1]} ${fa(m.regDate.jy)}</p>`;
    return `
    <div class="member ${over?'overdue':''}">
      <div class="avatar">${initial}</div>
      <div class="info" data-edit="${m.id}">
        <p class="name">${escapeHtml(m.name)}</p>
        <p class="phone">${m.phone ? escapeHtml(m.phone) : 'بدون شماره'}</p>
        ${m.sport ? `<span class="tag">${escapeHtml(m.sport)}</span>` : ''}
        ${dueHtml}
      </div>
      <button class="status-btn ${paid?'paid':'unpaid'}" data-id="${m.id}">${paid?'پرداخت‌شده':'ثبت پرداخت'}</button>
      <button class="del" data-del="${m.id}" aria-label="حذف">×</button>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('list').addEventListener('click', e=>{
  const btn = e.target.closest('[data-id]');
  const del = e.target.closest('[data-del]');
  const ed = e.target.closest('[data-edit]');
  if(ed && !btn && !del){ openSheet(members.find(x=>x.id===ed.dataset.edit)); return; }
  if(btn){
    const m = members.find(x=>x.id===btn.dataset.id);
    if(m){ const k = monthKeyFor(selectedMonth); m.paidMonths[k] = !m.paidMonths[k]; save(); render(); }
  }
  if(del){
    members = members.filter(x=>x.id!==del.dataset.del);
    save(); render();
  }
});

document.getElementById('search').addEventListener('input', e=>{
  query = e.target.value; render();
});

document.querySelectorAll('#statusFilters .chip').forEach(c=>{
  c.addEventListener('click', ()=>{
    document.querySelectorAll('#statusFilters .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    filter = c.dataset.f;
    render();
  });
});

document.querySelectorAll('#sportFilters .chip').forEach(c=>{
  c.addEventListener('click', ()=>{
    document.querySelectorAll('#sportFilters .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    sportFilter = c.dataset.s;
    render();
  });
});

const sheetBg = document.getElementById('sheetBg');
let editingId = null;
const regD=document.getElementById('regD'), regM=document.getElementById('regM'), regY=document.getElementById('regY');
regD.innerHTML = Array.from({length:31},(_,i)=>`<option value="${i+1}">${fa(i+1)}</option>`).join('');
regM.innerHTML = monthNames.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');
regY.innerHTML = Array.from({length:11},(_,i)=>year-i).map(y=>`<option value="${y}">${fa(y)}</option>`).join('');
function openSheet(m){
  editingId = m ? m.id : null;
  document.getElementById('sheetTitle').textContent = m ? 'ویرایش عضو' : 'عضو جدید';
  document.getElementById('saveBtn').textContent = m ? 'ذخیره' : 'افزودن';
  document.getElementById('newName').value = m ? m.name : '';
  document.getElementById('newPhone').value = m ? (m.phone||'') : '';
  document.getElementById('newSport').value = m && m.sport ? m.sport : 'بدنسازی';
  const r = (m && m.regDate) || today;
  regD.value=r.jd; regM.value=r.jm; regY.value=r.jy;
  sheetBg.classList.add('show');
  document.getElementById('newName').focus();
}
document.getElementById('addBtn').addEventListener('click', ()=> openSheet(null));
document.getElementById('alertBanner').addEventListener('click', ()=>{
  for(let i=currentMonthIndex;i>=0;i--){ if(members.some(m=>hasLate(m,i))){ selectedMonth=i; break; } }
  setFilter('unpaid');
});
document.getElementById('cancelBtn').addEventListener('click', ()=> closeSheet());
sheetBg.addEventListener('click', e=>{ if(e.target===sheetBg) closeSheet(); });
function closeSheet(){
  editingId = null;
  sheetBg.classList.remove('show');
  document.getElementById('newName').value='';
  document.getElementById('newPhone').value='';
}
document.getElementById('saveBtn').addEventListener('click', ()=>{
  const name = document.getElementById('newName').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  const sport = document.getElementById('newSport').value;
  if(!name) return;
  const jy=+regY.value, jm=+regM.value, regDate={ jy, jm, jd:Math.min(+regD.value, mLen(jy,jm)) };
  const ex = editingId && members.find(x=>x.id===editingId);
  if(ex){ Object.assign(ex,{name,phone,sport,regDate}); }
  else members.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), name, phone, sport, regDate, paidMonths:{} });
  save();
  closeSheet();
  render();
});

/* ---- پایان ماه: هشدار افرادی که ماهِ قبل را پرداخت نکرده‌اند ---- */
function checkMonthEnd(){
  const p=currentMonthIndex-1; if(p<0) return;
  const key='gym_ack_'+year+'-'+currentMonthIndex;
  try{ if(localStorage.getItem(key)) return; }catch(e){}
  const late=members.filter(m=>hasLate(m,p));
  if(!late.length) return;
  document.getElementById('endTitle').textContent='ماه '+monthNames[p]+' تمام شد — '+fa(late.length)+' نفر شهریه نداده‌اند';
  document.getElementById('endList').innerHTML=late.map(m=>'• '+escapeHtml(m.name)).join('<br>');
  const bg=document.getElementById('endBg'); bg.classList.add('show');
  const ack=()=>{ try{localStorage.setItem(key,'1');}catch(e){} bg.classList.remove('show'); };
  document.getElementById('endOk').onclick=ack;
  document.getElementById('endView').onclick=()=>{ ack(); selectedMonth=p; setFilter('unpaid'); };
}
// اگر اپ از پس‌زمینه برگشت و روز عوض شده بود، دوباره بارگذاری شود
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && new Date().getDate()!==_n.getDate()) location.reload(); });

/* ---- پشتیبان‌گیری و بازیابی ---- */
const backupBg=document.getElementById('backupBg');
document.getElementById('backupOpen').addEventListener('click',()=>backupBg.classList.add('show'));
document.getElementById('backupClose').addEventListener('click',()=>backupBg.classList.remove('show'));
backupBg.addEventListener('click',e=>{ if(e.target===backupBg) backupBg.classList.remove('show'); });

async function exportBackup(){
  const p2=n=>String(n).padStart(2,'0');
  const name='eco-gym-backup-'+today.jy+'-'+p2(today.jm)+'-'+p2(today.jd)+'.json';
  const data={ app:'eco-gym', version:1, exportedAt:new Date().toISOString(), members };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
      await navigator.share({files:[file],title:'پشتیبان باشگاه اکو'});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
document.getElementById('exportBtn').addEventListener('click',exportBackup);

const importFile=document.getElementById('importFile');
document.getElementById('importBtn').addEventListener('click',()=>importFile.click());
importFile.addEventListener('change',()=>{
  const f=importFile.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const list=Array.isArray(d)?d:d.members;
      if(!Array.isArray(list) || list.some(m=>!m || typeof m.name!=='string')) throw 0;
      if(!confirm('اطلاعات فعلی با '+fa(list.length)+' عضو از فایل پشتیبان جایگزین شود؟')) return;
      members=list.map(m=>({ id:m.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:m.name, phone:m.phone||'', sport:m.sport||'', regDate:m.regDate||null, paidMonths:m.paidMonths||{} }));
      save(); backupBg.classList.remove('show'); render();
    }catch(e){ alert('فایل معتبر نیست.'); }
    importFile.value='';
  };
  r.readAsText(f);
});

renderMonths();
render();
checkMonthEnd();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
